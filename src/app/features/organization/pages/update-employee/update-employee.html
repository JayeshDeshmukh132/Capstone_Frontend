<div class="d-flex justify-content-between align-items-center mb-3">
  <div>
    <h2 class="h3">Update Employee Details</h2>
    <p class="text-muted mb-0">Modify the details for the selected employee.</p>
  </div>
  <a routerLink="/org/employees" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-left me-1"></i>Back to List
  </a>
</div>

<div class="card shadow-sm">
  <div *ngIf="loading()" class="card-body text-center p-5">
    <div class="spinner-border" role="status"></div>
  </div>

  <form *ngIf="!loading()" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="card-body">
      <div *ngIf="alert()" [class]="'alert ' + alert()!.type" role="alert">
        {{ alert()!.message }}
        <button type="button" class="btn-close" (click)="hideAlert()" aria-label="Close"></button>
      </div>
      
      <!-- Form fields are identical to create-employee, so we'll just show the form structure -->
      <h5 class="card-title">Personal Details</h5>
      <hr>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="employeeId" class="form-label">Employee ID</label>
          <input type="text" id="employeeId" class="form-control" formControlName="employeeId" />
          <!-- Validation messages -->
        </div>
        <div class="col-md-6 mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" class="form-control" formControlName="email" />
          <!-- Validation messages -->
        </div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="firstName" class="form-label">First Name</label>
          <input type="text" id="firstName" class="form-control" formControlName="firstName" />
        </div>
        <div class="col-md-6 mb-3">
          <label for="lastName" class="form-label">Last Name</label>
          <input type="text" id="lastName" class="form-control" formControlName="lastName" />
        </div>
      </div>
      
      <h5 class="card-title mt-4">Job & Bank Details</h5>
      <hr>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="designation" class="form-label">Designation</label>
          <input type="text" id="designation" class="form-control" formControlName="designation" />
        </div>
        <div class="col-md-6 mb-3">
          <label for="department" class="form-label">Department</label>
          <input type="text" id="department" class="form-control" formControlName="department" />
        </div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="accountNumber" class="form-label">Bank Account Number</label>
          <input type="text" id="accountNumber" class="form-control" formControlName="accountNumber" />
        </div>
        <div class="col-md-6 mb-3">
          <label for="ifscCode" class="form-label">IFSC Code</label>
          <input type="text" id="ifscCode" class="form-control text-uppercase" formControlName="ifscCode" />
        </div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="joiningDate" class="form-label">Joining Date</label>
          <input type="date" id="joiningDate" class="form-control" formControlName="joiningDate" />
        </div>
      </div>
    </div>
    <div class="card-footer text-end">
      <button type="submit" class="btn btn-primary" [disabled]="saving()">
        <span *ngIf="saving()" class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
        {{ saving() ? 'Saving Changes...' : 'Save Changes' }}
      </button>
    </div>
  </form>
</div>
