<div class="d-flex justify-content-between align-items-center mb-3">
  <div>
    <h2 class="h3">New Vendor Payment</h2>
    <p class="text-muted mb-0">Create a payment request for a registered vendor.</p>
  </div>
  <a routerLink="/org/payment-requests" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-left me-1"></i>Back to List
  </a>
</div>

<div class="card shadow-sm">
  <div *ngIf="status() === 'loading'" class="card-body text-center p-5">
    <div class="spinner-border" role="status"></div>
  </div>

  <form *ngIf="status() !== 'loading'" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="card-body">
      <div *ngIf="successMessage()" class="alert alert-success">{{ successMessage() }}</div>
      <div *ngIf="errorMessage()" class="alert alert-danger">{{ errorMessage() }}</div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="clientVendorId" class="form-label">Pay To Vendor</label>
          <select id="clientVendorId" class="form-select" formControlName="clientVendorId">
            <option [ngValue]="null" disabled>Select a vendor...</option>
            <option *ngFor="let vendor of vendors()" [ngValue]="vendor.id">
              {{ vendor.name }} ({{ vendor.accountNumber }})
            </option>
          </select>
          <div *ngIf="vendors().length === 0" class="form-text">
            No vendors found. <a routerLink="/org/clients-vendors">Add one here</a>.
          </div>
          <div *ngIf="form.controls.clientVendorId.touched && form.controls.clientVendorId.hasError('required')" class="invalid-feedback d-block">
            Please select a vendor.
          </div>
        </div>
        <div class="col-md-6 mb-3">
          <label for="bankAccountId" class="form-label">Pay From Account</label>
          <select id="bankAccountId" class="form-select" formControlName="bankAccountId">
            <option [ngValue]="null" disabled>Select a source account...</option>
            <option *ngFor="let acc of bankAccounts()" [ngValue]="acc.id">
              {{ acc.bankAccountNumber }} (Balance: {{ acc.balance | currency:'INR' }})
            </option>
          </select>
          <div *ngIf="form.controls.bankAccountId.touched && form.controls.bankAccountId.hasError('required')" class="invalid-feedback d-block">
            Please select a bank account.
          </div>
        </div>
      </div>

      <div class="mb-3">
        <label for="amount" class="form-label">Payment Amount</label>
        <div class="input-group">
          <span class="input-group-text">₹</span>
          <input type="number" id="amount" class="form-control" formControlName="amount" placeholder="0.00" />
        </div>
        <div *ngIf="form.controls.amount.touched && form.controls.amount.errors" class="invalid-feedback d-block">
          <span *ngIf="form.controls.amount.hasError('required')">Amount is required.</span>
          <span *ngIf="form.controls.amount.hasError('min')">Amount must be a positive number.</span>
        </div>
      </div>

      <div class="mb-3">
        <label for="description" class="form-label">Description / Invoice #</label>
        <textarea id="description" class="form-control" formControlName="description" rows="3"></textarea>
        <div *ngIf="form.controls.description.touched && form.controls.description.hasError('required')" class="invalid-feedback d-block">
          A description is required.
        </div>
      </div>
    </div>
    <div class="card-footer text-end">
      <button type="submit" class="btn btn-primary" [disabled]="status() === 'submitting'">
        <span *ngIf="status() === 'submitting'" class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
        {{ status() === 'submitting' ? 'Submitting...' : 'Submit Vendor Payment' }}
      </button>
    </div>
  </form>
</div>
