<!-- Main App Container -->
<div class="d-flex flex-column vh-100">
  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm flex-shrink-0">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">
        <i class="bi bi-bank2 me-2"></i>Bank Administrator
      </a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#adminNavbar"
        aria-controls="adminNavbar"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="adminNavbar">
        <!-- Links for mobile view, hidden on larger screens -->
        <ul class="navbar-nav d-lg-none">
          <li class="nav-item">
            <a class="nav-link" routerLink="organizations" routerLinkActive="active">
              <i class="bi bi-building me-2"></i> Organizations
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="notifications" routerLinkActive="active">
              <i class="bi bi-bell me-2"></i> Notifications
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="settings" routerLinkActive="active">
              <i class="bi bi-gear me-2"></i> Settings
            </a>
          </li>
        </ul>
        <!-- Right-aligned items -->
        <div class="ms-auto">
          <button class="btn btn-outline-light d-flex align-items-center" (click)="logout()">
            <i class="bi bi-box-arrow-right me-2"></i> Logout
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Layout -->
  <div class="main-layout">
    <!-- Sidebar (visible on large screens) -->
    <aside class="sidebar d-none d-lg-flex">
      <div class="sidebar-header text-center">
        <h5 class="mb-0 fw-semibold">Bank Portal</h5>
      </div>
      <ul class="nav nav-pills flex-column gap-1">
        <li class="nav-item">
          <a class="nav-link d-flex align-items-center" routerLink="organizations" routerLinkActive="active">
            <i class="bi bi-building me-2 fs-5"></i> Organizations
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link d-flex align-items-center" routerLink="notifications" routerLinkActive="active">
            <i class="bi bi-bell me-2 fs-5"></i> Notifications
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link d-flex align-items-center" routerLink="settings" routerLinkActive="active">
            <i class="bi bi-gear me-2 fs-5"></i> Settings
          </a>
        </li>
      </ul>
    </aside>

    <!-- Content Area -->
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
